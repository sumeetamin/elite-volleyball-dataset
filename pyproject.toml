[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-volleyball-dataset"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=16", "pydantic>=2.7", "PyYAML>=6", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
volley-data = "volleyball_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
